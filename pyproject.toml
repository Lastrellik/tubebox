[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tubebox"
version = "0.1.0"
description = "A simple offline video library for Kodi"
requires-python = ">=3.10"

[project.scripts]
tubebox = "tubebox.cli:main"

[tool.setuptools]
packages = ["tubebox"]
